# webL10n resource index (official format).
# At startup l10n.js loads this file for the target language and
# @imports the matching .properties for whichever [lang] section hits;
# language comparison is case-insensitive (RFC 4646).
# Adding a language: add a section plus the matching .properties file.

[en-US]
@import url(en-US.properties)

[hi-IN]
@import url(hi-IN.properties)

[fr-FR]
@import url(fr-FR.properties)

[sw-KE]
@import url(sw-KE.properties)
