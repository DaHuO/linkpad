# KaiOS Bookmark Manager — en-US (default)
# Note: the webL10n parser has no line continuation - each key must be
# written on a single line.

# ---- Static strings (referenced by data-l10n-id in index.html) ----
# Note: the app name "LinkPad" is a brand - shown identically in every
# language straight from the HTML, so it has no key here.
add-bookmark = + Add bookmark
search-input.placeholder = Type keywords
empty-title = Nothing saved yet
empty-sub = Press Enter to hang your first ribbon
no-match = No matching bookmarks
label-title = Title (required)
label-url = URL (required)
f-url.placeholder = example.com
save = Save
cancel = Cancel
menu-title = Actions
menu-open = Open
menu-edit = Edit
delete = Delete
confirm-title = Delete bookmark
lang-title = Select language
lang-system = Follow system language

# ---- Dynamic strings (referenced via navigator.webL10n.get() in js/app.js) ----
search = Search…
search-query = Search: {{query}}
sort-by-date = Sort: date added
sort-by-visited = Sort: last visited
lang-cmd = Language: {{lang}}
count = {{n}} in total
storage-unavailable = storage unavailable
form-title-add = Add bookmark
form-title-edit = Edit bookmark
added-info = added {{date}}
visited-info = visited {{date}}
never-visited = never visited
delete-confirm = Delete "{{title}}"? This cannot be undone.

# ---- Soft key bar: middle = Enter action / right = backspace action ----
act-add = Add
act-open = Open
act-search = Search
act-sort = Sort
act-lang = Language
act-select = Select
act-confirm = Confirm
act-menu = Menu
act-back = Back

# ---- Transient messages (toast) ----
toast-added = Added
toast-saved = Saved
toast-deleted = Deleted
toast-search-cleared = Search cleared
toast-sort-date = Sorted by date added
toast-sort-visited = Sorted by last visited
toast-title-empty = Title is required
toast-url-empty = URL is required
toast-not-found = Bookmark not found
toast-orig-missing = Original bookmark not found
toast-lang-applied = Language: {{lang}}
toast-opened = Opened: {{host}}

# ---- Error messages (err-* prefixes are joined with details) ----
err-save = Save failed:
err-delete = Delete failed:
err-load = Load failed:
err-record = Failed to record visit:
err-activity = Failed to open URL:
err-storage = Storage unavailable
err-quota = Storage is full. Delete some bookmarks and try again.
err-no-idb = This device does not support IndexedDB
err-db-open = Failed to open the database
err-db-busy = Database is busy, close other windows
err-db-read = Read failed
err-db-write = Write failed
err-db-del = Delete failed
err-popup = Pop-up blocked by the browser
err-open-fail = Cannot open this URL
err-unknown = Unknown error
